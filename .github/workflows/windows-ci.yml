name: SYTOX Windows Checks
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel outdated pushes on a release branch. Never cancel main with a new branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --upgrade pip
          & .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'pip failed' }
      - name: Windows unit, Win32, and Qt startup tests
        shell: powershell
        run: .\Windows_Smoke_Test.ps1
      - name: Capture actual black-red PySide6 workspace
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          .\.venv\Scripts\python.exe tools/windows_ui_preview.py preview/sytox-black-crimson.png
          if ($LASTEXITCODE -ne 0) { throw 'Native UI screenshot failed' }
      - name: Upload visual workspace preview
        uses: actions/upload-artifact@v4
        with:
          name: sytox-ui-preview-0.3.8
          path: preview/sytox-black-crimson.png
          if-no-files-found: error
      - name: Build EXE and smoke-test startup
        shell: powershell
        run: .\Windows_Smoke_Test.ps1 -BuildExe
      - name: Verify direct-update Windows archive from tested EXE
        shell: pwsh
        run: |
          $zip = "dist/SYTOX_Assistant_Portable_CI.zip"
          Compress-Archive -Path "dist/SYTOX_Assistant/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          if (!(Test-Path $zip)) { throw "Portable archive not created" }
          & .\.venv\Scripts\python.exe -c "from pathlib import Path; import zipfile; from sytox.updater import _valid_archive_entry; p=Path('dist/SYTOX_Assistant_Portable_CI.zip'); z=zipfile.ZipFile(p); files=[i.filename for i in z.infolist()]; [_valid_archive_entry(i) for i in z.infolist()]; assert 'SYTOX_Assistant.exe' in files and any(f.startswith('_internal/') for f in files); print('Verified direct-update archive:',p.stat().st_size,'bytes')"
          if ($LASTEXITCODE -ne 0) { throw "Portable archive validation failed" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify real Python, C#, Go and Rust EXEs
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $PWD '.venv\Scripts') + ';' + $env:PATH
          & .\.venv\Scripts\python.exe -m pip install "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller setup for real project builds failed' }
          & .\.venv\Scripts\python.exe tools/windows_project_build_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Real project EXE build or launch test failed' }
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and run 8 extra language examples
        shell: pwsh
        run: |
          choco install mingw php lua kotlinc --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Extra language compiler installation failed' }
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $env:PATH = 'C:\ProgramData\mingw64\mingw64\bin;' + (Join-Path $PWD '.venv\Scripts') + ';' + $env:PATH
          npm install --global typescript
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript setup failed' }
          & .\.venv\Scripts\python.exe tools/windows_multilang_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'One of the 8 extra language build/run checks failed' }
      - name: Make sure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 missing' }
      - name: Compile Windows installer from tested EXE
        shell: powershell
        run: |
          .\Build_Installer.ps1 -SkipExeBuild
          if (!(Test-Path 'installer\SYTOX_Assistant_Setup_0.3.8.exe')) { throw 'Installer was not built' }
      - name: Install, launch, uninstall and verify user data on Windows runner
        shell: powershell
        run: .\Installer_Install_Smoke_Test.ps1
      - name: Windows build checksums
        shell: pwsh
        run: |
          $files = @(
            'installer/SYTOX_Assistant_Setup_0.3.8.exe',
            'dist/SYTOX_Assistant/SYTOX_Assistant.exe'
          )
          foreach ($file in $files) { (Get-FileHash $file -Algorithm SHA256) | Format-List }
      - name: Archive Windows standalone app (CI artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: sytox-windows-app-0.3.8
          path: dist/SYTOX_Assistant/
          if-no-files-found: error
      - name: Archive Windows installer (CI artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: sytox-windows-setup-0.3.8
          path: installer/SYTOX_Assistant_Setup_0.3.8.exe
          if-no-files-found: error

  publish-verified-038:
    name: Publish SYTOX 0.3.8 after verified Windows install
    needs: windows-smoke
    # Only the tested default-branch commit can publish an official release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested installer artifact
        uses: actions/download-artifact@v4
        with:
          name: sytox-windows-setup-0.3.8
          path: release
      - name: Check exact release version and existing official release
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'from sytox import __version__; print(__version__)')
          if [ "$version" != "0.3.8" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view v0.3.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f release/SYTOX_Assistant_Setup_0.3.8.exe
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Checksum and publish tested installer with verified tag
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum SYTOX_Assistant_Setup_0.3.8.exe > SYTOX_Assistant_Setup_0.3.8.exe.sha256
          gh release create v0.3.8 \
            SYTOX_Assistant_Setup_0.3.8.exe \
            SYTOX_Assistant_Setup_0.3.8.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SYTOX Assistant 0.3.8" \
            --notes "Version 0.3.8: lokales Langzeitgedaechtnis mit Auto-Erinnerungen, Aktualisierung, Loeschen, Opt-out und Projektverlauf. Bestehende Windows-Komponenten-, Build-, Installer- und 12-Sprachen-Tests erfolgreich. Windows-Tests, EXE-Start, Installation und Deinstallation wurden im CI-Lauf vor Veröffentlichung bestanden. Installer mit SHA-256-Datei."
