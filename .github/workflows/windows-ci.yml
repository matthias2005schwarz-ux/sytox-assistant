name: SYTOX Windows Checks
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel outdated pushes on a release branch. Never cancel main with a new branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --upgrade pip
          & .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'pip failed' }
      - name: Windows unit, Win32, and Qt startup tests
        shell: powershell
        run: .\Windows_Smoke_Test.ps1
      - name: Capture actual black-red PySide6 workspace
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          .\.venv\Scripts\python.exe tools/windows_ui_preview.py preview/sytox-black-crimson.png
          if ($LASTEXITCODE -ne 0) { throw 'Native UI screenshot failed' }
      - name: Upload visual workspace preview
        uses: actions/upload-artifact@v4
        with:
          name: sytox-ui-preview-0.3.6
          path: preview/sytox-black-crimson.png
          if-no-files-found: error
      - name: Build EXE and smoke-test startup
        shell: powershell
        run: .\Windows_Smoke_Test.ps1 -BuildExe
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify real Python, C#, Go and Rust EXEs
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $PWD '.venv\Scripts') + ';' + $env:PATH
          & .\.venv\Scripts\python.exe -m pip install "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller setup for real project builds failed' }
          & .\.venv\Scripts\python.exe tools/windows_project_build_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Real project EXE build or launch test failed' }
      - name: Make sure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 missing' }
      - name: Compile Windows installer from tested EXE
        shell: powershell
        run: |
          .\Build_Installer.ps1 -SkipExeBuild
          if (!(Test-Path 'installer\SYTOX_Assistant_Setup_0.3.6.exe')) { throw 'Installer was not built' }
      - name: Install, launch, uninstall and verify user data on Windows runner
        shell: powershell
        run: .\Installer_Install_Smoke_Test.ps1
      - name: Windows build checksums
        shell: pwsh
        run: |
          $files = @(
            'installer/SYTOX_Assistant_Setup_0.3.6.exe',
            'dist/SYTOX_Assistant/SYTOX_Assistant.exe'
          )
          foreach ($file in $files) { (Get-FileHash $file -Algorithm SHA256) | Format-List }
      - name: Archive Windows standalone app (CI artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: sytox-windows-app-0.3.6
          path: dist/SYTOX_Assistant/
          if-no-files-found: error
      - name: Archive Windows installer (CI artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: sytox-windows-setup-0.3.6
          path: installer/SYTOX_Assistant_Setup_0.3.6.exe
          if-no-files-found: error

  publish-verified-036:
    name: Publish SYTOX 0.3.6 after verified Windows install
    needs: windows-smoke
    # Only the tested default-branch commit can publish an official release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested installer artifact
        uses: actions/download-artifact@v4
        with:
          name: sytox-windows-setup-0.3.6
          path: release
      - name: Check exact release version and existing official release
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'from sytox import __version__; print(__version__)')
          if [ "$version" != "0.3.6" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view v0.3.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f release/SYTOX_Assistant_Setup_0.3.6.exe
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Checksum and publish tested installer with verified tag
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum SYTOX_Assistant_Setup_0.3.6.exe > SYTOX_Assistant_Setup_0.3.6.exe.sha256
          gh release create v0.3.6 \
            SYTOX_Assistant_Setup_0.3.6.exe \
            SYTOX_Assistant_Setup_0.3.6.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SYTOX Assistant 0.3.6" \
            --notes "Freigabepflichtiger Projekt-Build mit verifizierter Windows-EXE, PE-Header, SHA-256 und echten Windows-Kompilierungs- und Laufzeittests fuer Python, C#, Go und Rust. Windows-Tests, EXE-Start, Installation und Deinstallation wurden im CI-Lauf vor Veröffentlichung bestanden. Installer mit SHA-256-Datei."
